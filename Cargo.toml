[workspace]
resolver = "2"
members = [
    "crates/vac",
    "crates/vac-format",
    "crates/vac-compiler",
    "crates/vac-decompiler",
    "crates/vac-metrics",
    "crates/vac-cli",
    "crates/pac-format",
    "crates/pac-decompiler",
    "crates/pac-compiler",
    "crates/pac-cli",
]

[workspace.package]
version = "0.13.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/vac"
description = "VAC — Video As Code. A purely algorithmic compiler/decompiler between video and structured source code. v0.9 closes the loop: reconstruction quality is now measured in pixels, not proxied by shape counts. `vac verify` decompiles, re-renders, and scores the result against the source; the corpus is baselined and regression-gated; and the first run found defects eight versions of count-based testing had missed."

[workspace.dependencies]
# Internal crates — VAC
vac = { path = "crates/vac", version = "0.13.0" }
vac-format = { path = "crates/vac-format", version = "0.13.0" }
vac-compiler = { path = "crates/vac-compiler", version = "0.13.0" }
vac-decompiler = { path = "crates/vac-decompiler", version = "0.13.0" }
vac-metrics = { path = "crates/vac-metrics", version = "0.13.0" }

# Internal crates — PAC (Picture As Code, still-image sibling of VAC)
pac-format = { path = "crates/pac-format", version = "0.13.0" }
pac-decompiler = { path = "crates/pac-decompiler", version = "0.13.0" }
pac-compiler = { path = "crates/pac-compiler", version = "0.13.0" }

# External crates (wide version reqs so cargo picks the latest compatible)
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "webp"] }
tiny-skia = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
