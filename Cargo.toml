[workspace]
resolver = "2"
members = [
    "crates/vac",
    "crates/vac-format",
    "crates/vac-compiler",
    "crates/vac-decompiler",
    "crates/vac-cli",
    "crates/pac-format",
    "crates/pac-decompiler",
    "crates/pac-compiler",
    "crates/pac-cli",
]

[workspace.package]
version = "0.5.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/vac"
description = "VAC — Video As Code. A purely algorithmic compiler/decompiler between video and structured source code. v0.5 graduates PAC (Picture As Code) from sibling experiment to first-class primitive with cubic-Bezier curves, linear-gradient fills, and auto-K palette sizing."

[workspace.dependencies]
# Internal crates — VAC
vac = { path = "crates/vac", version = "0.5.2" }
vac-format = { path = "crates/vac-format", version = "0.5.2" }
vac-compiler = { path = "crates/vac-compiler", version = "0.5.2" }
vac-decompiler = { path = "crates/vac-decompiler", version = "0.5.2" }

# Internal crates — PAC (Picture As Code, still-image sibling of VAC)
pac-format = { path = "crates/pac-format", version = "0.5.2" }
pac-decompiler = { path = "crates/pac-decompiler", version = "0.5.2" }
pac-compiler = { path = "crates/pac-compiler", version = "0.5.2" }

# External crates (wide version reqs so cargo picks the latest compatible)
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "webp"] }
tiny-skia = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
