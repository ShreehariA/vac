[workspace]
resolver = "2"
members = [
    "crates/vac",
    "crates/vac-format",
    "crates/vac-compiler",
    "crates/vac-decompiler",
    "crates/vac-cli",
    "crates/pac-format",
    "crates/pac-decompiler",
    "crates/pac-compiler",
    "crates/pac-cli",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/vac"
description = "VAC — Video As Code. A purely algorithmic compiler/decompiler between video and structured source code. v0.8 measures the scene before it tracks anything: a temporal-median plate plus per-pixel agreement separate persistent scenery from moving content, occluders keep their silhouettes, and the decompiler is now reproducible run to run."

[workspace.dependencies]
# Internal crates — VAC
vac = { path = "crates/vac", version = "0.8.0" }
vac-format = { path = "crates/vac-format", version = "0.8.0" }
vac-compiler = { path = "crates/vac-compiler", version = "0.8.0" }
vac-decompiler = { path = "crates/vac-decompiler", version = "0.8.0" }

# Internal crates — PAC (Picture As Code, still-image sibling of VAC)
pac-format = { path = "crates/pac-format", version = "0.8.0" }
pac-decompiler = { path = "crates/pac-decompiler", version = "0.8.0" }
pac-compiler = { path = "crates/pac-compiler", version = "0.8.0" }

# External crates (wide version reqs so cargo picks the latest compatible)
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "webp"] }
tiny-skia = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
