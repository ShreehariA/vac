name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --workspace --all-targets

      - name: Run tests (round-trip + unit)
        run: cargo test --release --workspace

      - name: Smoke-test the CLI on the bundled fixtures
        run: |
          cargo run --release -p vac-cli -- compile   examples/ball.vac      target/ci/ball.gif
          cargo run --release -p vac-cli -- decompile target/ci/ball.gif     target/ci/ball.roundtrip.vac
          cargo run --release -p vac-cli -- compile   examples/diagonal.vac  target/ci/diagonal.gif
          cargo run --release -p vac-cli -- decompile target/ci/diagonal.gif target/ci/diagonal.roundtrip.vac
          cargo run --release -p vac-cli -- compile   examples/two_balls.vac target/ci/two_balls.gif
          cargo run --release -p vac-cli -- decompile target/ci/two_balls.gif target/ci/two_balls.roundtrip.vac
          test -s target/ci/ball.gif
          test -s target/ci/ball.roundtrip.vac
          test -s target/ci/diagonal.gif
          test -s target/ci/diagonal.roundtrip.vac
          test -s target/ci/two_balls.gif
          test -s target/ci/two_balls.roundtrip.vac
          # Two-balls fixture must produce two `shape_*` declarations.
          shapes=$(grep -c '^  let shape_' target/ci/two_balls.roundtrip.vac || true)
          echo "two_balls round-trip shape count: $shapes"
          test "$shapes" = "2"

      - name: Upload round-trip artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-output
          path: |
            target/ci/*.gif
            target/ci/*.roundtrip.vac
            target/test-roundtrip/*
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + components)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -W clippy::all
