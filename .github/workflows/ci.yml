name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg (for v0.4 MP4 round-trip)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Build (release)
        run: cargo build --release --workspace --all-targets

      - name: Run tests (round-trip + unit, both GIF and MP4)
        run: cargo test --release --workspace

      - name: Smoke-test the GIF path
        run: |
          cargo run --release -p vac-cli -- compile   examples/ball.vac      target/ci/ball.gif
          cargo run --release -p vac-cli -- decompile target/ci/ball.gif     target/ci/ball.gif.vac
          cargo run --release -p vac-cli -- compile   examples/diagonal.vac  target/ci/diagonal.gif
          cargo run --release -p vac-cli -- decompile target/ci/diagonal.gif target/ci/diagonal.gif.vac
          cargo run --release -p vac-cli -- compile   examples/two_balls.vac target/ci/two_balls.gif
          cargo run --release -p vac-cli -- decompile target/ci/two_balls.gif target/ci/two_balls.gif.vac
          test -s target/ci/ball.gif
          test -s target/ci/diagonal.gif
          test -s target/ci/two_balls.gif
          # Two-balls must produce two `shape_*` declarations.
          shapes=$(grep -c '^  let shape_' target/ci/two_balls.gif.vac || true)
          test "$shapes" = "2"

      # v0.9: a shape count says how *small* the output is, not how
      # *right* it is. `vac verify` decompiles, re-renders, and compares
      # the pixels against the source. The gate is ink IoU, which is what
      # catches a reconstruction that emits exactly the expected number
      # of shapes and puts them in the wrong place.
      - name: Measure round-trip fidelity (v0.9)
        run: |
          cargo run --release -q -p vac-cli -- verify target/ci/ball.gif
          cargo run --release -q -p vac-cli -- verify target/ci/two_balls.gif --json \
            > target/ci/two_balls.fidelity.json
          cat target/ci/two_balls.fidelity.json
          # Measured 2026-08-22: two_balls scores 0.9523 through the
          # hermetic loop and 0.8399 through GIF. That 0.112 gap is the
          # codec penalty — GIF palette quantisation, not the decompiler.
          # The floor is set below the GIF number, not the hermetic one.
          python3 -c 'import json,sys; d=json.load(open("target/ci/two_balls.fidelity.json"))["result"]; iou=d["ink_iou"]; print("two_balls.gif ink IoU = %.4f" % iou); sys.exit("ink IoU %.4f below floor 0.80" % iou) if iou < 0.80 else None'

      - name: Smoke-test the MP4 path (v0.4)
        run: |
          cargo run --release -p vac-cli -- compile   examples/ball.vac      target/ci/ball.mp4
          cargo run --release -p vac-cli -- decompile target/ci/ball.mp4     target/ci/ball.mp4.vac
          cargo run --release -p vac-cli -- compile   examples/two_balls.vac target/ci/two_balls.mp4
          cargo run --release -p vac-cli -- decompile target/ci/two_balls.mp4 target/ci/two_balls.mp4.vac
          test -s target/ci/ball.mp4
          test -s target/ci/two_balls.mp4
          # The v0.4 promise: MP4 round-trip preserves source FPS exactly.
          grep -q '^canvas 480x320 @30fps' target/ci/ball.mp4.vac
          grep -q '^canvas 640x360 @30fps' target/ci/two_balls.mp4.vac
          # Same multi-shape invariant via MP4.
          shapes=$(grep -c '^  let shape_' target/ci/two_balls.mp4.vac || true)
          test "$shapes" = "2"

      # v1.0: VAC as a codec. The quality dial must trade bytes for
      # fidelity, and rate control must deliver a reconstruction that
      # meets the PSNR it was asked for — measured by `verify --vac`, the
      # same tool that scores any hand-edited source.
      - name: Codec dial and rate control (v1.0)
        run: |
          cargo run --release -q -p vac-cli -- decompile target/ci/two_balls.mp4 target/ci/two_balls.q0.vac --quality 0
          cargo run --release -q -p vac-cli -- decompile target/ci/two_balls.mp4 target/ci/two_balls.q100.vac --quality 100
          test -s target/ci/two_balls.q0.vac
          test "$(wc -c < target/ci/two_balls.q0.vac)" -le "$(wc -c < target/ci/two_balls.q100.vac)"
          cargo run --release -q -p vac-cli -- decompile target/ci/two_balls.mp4 target/ci/two_balls.target.vac --target-psnr 35
          cargo run --release -q -p vac-cli -- verify target/ci/two_balls.mp4 --vac target/ci/two_balls.target.vac --json \
            > target/ci/two_balls.target.json
          python3 -c 'import json,sys; d=json.load(open("target/ci/two_balls.target.json"))["result"]; p=d["psnr_db"]; print("rate-controlled two_balls: %.2f dB, %d bytes" % (p, d["vac_bytes"])); sys.exit("missed the 35 dB target: %.2f" % p) if p < 35 else None'

      # v1.6 / v1.7 / v1.8: scenery no vector can describe takes a raster
      # plate, every shape left in the output has to have earned its place —
      # GIF palette flicker over the texture must not come back as shapes —
      # and a mover no flat fill describes keeps its own pixels as a sprite.
      - name: Raster plate, shape audit and sprites (v1.6–v1.8)
        run: |
          cargo run --release -q -p vac-cli -- compile   examples/textured.vac  target/ci/textured.gif
          cargo run --release -q -p vac-cli -- decompile target/ci/textured.gif target/ci/textured.gif.vac
          test "$(grep -c '= image(' target/ci/textured.gif.vac)" = "1"
          shapes=$(grep -c '^  let shape_' target/ci/textured.gif.vac || true)
          echo "textured.gif: $shapes moving shape(s) over the plate"
          test "$shapes" -le 2
          cargo run --release -q -p vac-cli -- verify target/ci/textured.gif --vac target/ci/textured.gif.vac --json \
            > target/ci/textured.fidelity.json
          python3 -c 'import json,sys; d=json.load(open("target/ci/textured.fidelity.json"))["result"]; p=d["psnr_db"]; print("textured.gif: %.2f dB" % p); sys.exit("raster plate below 28 dB: %.2f" % p) if p < 28 else None'
          cargo run --release -q -p vac-cli -- compile   examples/sprite.vac  target/ci/sprite.mp4
          cargo run --release -q -p vac-cli -- decompile target/ci/sprite.mp4 target/ci/sprite.mp4.vac
          test "$(grep -c '= image(' target/ci/sprite.mp4.vac)" = "1"
          cargo run --release -q -p vac-cli -- verify target/ci/sprite.mp4 --vac target/ci/sprite.mp4.vac --json \
            > target/ci/sprite.fidelity.json
          # Measured 2026-10-13: 37.15 dB with the sprite, 26.00 dB as a flat rect.
          python3 -c 'import json,sys; d=json.load(open("target/ci/sprite.fidelity.json"))["result"]; p=d["psnr_db"]; print("sprite.mp4: %.2f dB" % p); sys.exit("sprite below 33 dB: %.2f" % p) if p < 33 else None'

      - name: Smoke-test the rect classifier (v0.4.1)
        run: |
          cargo run --release -p vac-cli -- compile   examples/sliding_rect.vac target/ci/sliding_rect.mp4
          cargo run --release -p vac-cli -- decompile target/ci/sliding_rect.mp4 target/ci/sliding_rect.mp4.vac
          test -s target/ci/sliding_rect.mp4
          # v0.4.1 promise: a rect input round-trips as rect, NOT ellipse.
          grep -q '^  let shape_0 = rect' target/ci/sliding_rect.mp4.vac
          # Width and height survive within ±3 px of source 120×60.
          shape_line=$(grep '^  let shape_0 = rect' target/ci/sliding_rect.mp4.vac)
          echo "recovered: $shape_line"
          # Bail loudly if the classifier silently regresses to ellipse.
          ! grep -q '^  let shape_0 = ellipse' target/ci/sliding_rect.mp4.vac

      - name: Smoke-test the PAC v0.2 pipeline (curves + gradients + auto-K)
        run: |
          mkdir -p target/ci/pac
          # 1. The committed example uses gradient() and path() primitives —
          #    must compile cleanly through the v0.2 renderer.
          cargo run --release -p pac-cli -- compile examples/hello.pac target/ci/pac/hello.png
          test -s target/ci/pac/hello.png
          # 2. Decompile that PNG with auto-K + curves + gradients on the
          #    defaults.  Output must contain a `canvas` header, ≥1 shape,
          #    and at least one `path(...)` (v0.2 emits Bezier curves by default).
          cargo run --release -p pac-cli -- decompile target/ci/pac/hello.png target/ci/pac/hello.pac --k 4 --k-max 8 --min-area 200
          grep -q '^canvas ' target/ci/pac/hello.pac
          shapes=$(grep -c '^let ' target/ci/pac/hello.pac || true)
          test "$shapes" -ge "1"
          grep -q '^let .* = path(' target/ci/pac/hello.pac
          # 3. The auto-K decompile round-trips to a renderable PNG.
          cargo run --release -p pac-cli -- compile target/ci/pac/hello.pac target/ci/pac/hello_re.png
          test -s target/ci/pac/hello_re.png
          # 4. Locking K (min == max) disables auto-K; verify it still works.
          cargo run --release -p pac-cli -- decompile target/ci/pac/hello.png target/ci/pac/hello_lockedk.pac --k 4 --k-max 4 --min-area 200
          grep -q '^canvas ' target/ci/pac/hello_lockedk.pac
          # 5. --no-smooth produces polygon(...) instead of path(...).
          cargo run --release -p pac-cli -- decompile target/ci/pac/hello.png target/ci/pac/hello_nosmooth.pac --no-smooth --k 4 --k-max 8 --min-area 200
          grep -q '^let .* = polygon(' target/ci/pac/hello_nosmooth.pac
          ! grep -q '^let .* = path(' target/ci/pac/hello_nosmooth.pac
          # 6. --no-gradients suppresses gradient() emission.
          cargo run --release -p pac-cli -- decompile target/ci/pac/hello.png target/ci/pac/hello_nograd.pac --no-gradients --k 4 --k-max 8 --min-area 200
          ! grep -q 'gradient(linear' target/ci/pac/hello_nograd.pac

      - name: Upload round-trip artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-output
          path: |
            target/ci/*.gif
            target/ci/*.mp4
            target/ci/*.vac
            target/ci/pac/*
            target/test-roundtrip/*
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + components)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -W clippy::all
